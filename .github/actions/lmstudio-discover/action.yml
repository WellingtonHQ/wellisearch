name: "LM Studio model discovery"
description: "Fetches the models currently loaded on the LM Studio server, refreshes the opencode provider config, and outputs the model id for the opencode step."

inputs:
  preferred-model:
    description: "Model id to use if loaded (e.g. qwen/qwen3.8-27b). Falls back to the first loaded model."
    required: false
    default: ""

outputs:
  model:
    description: "The selected model id (provider/model)."
    value: ${{ steps.discover.outputs.model }}
  models:
    description: "Comma-separated list of loaded models."
    value: ${{ steps.discover.outputs.models }}

runs:
  using: "composite"
  steps:
    # LMSTUDIO_URL and LMSTUDIO_API_KEY arrive via the runner's own environment;
    # do NOT re-declare them here (declaring them masks the inherited values).
    - id: discover
      name: Discover models and update opencode config
      shell: bash
      env:
        LMSTUDIO_PREFERRED_MODEL: ${{ inputs.preferred-model }}
      run: python3 "$GITHUB_ACTION_PATH/discover.py"
