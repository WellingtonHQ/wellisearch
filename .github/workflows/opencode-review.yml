name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Only one review runs per PR: a newer push cancels the pending (or in-progress)
# run so the latest iteration of the branch is what gets reviewed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      (
        github.event.pull_request.permissions.admin ||
        github.event.pull_request.permissions.maintain ||
        github.event.pull_request.permissions.push ||
        contains('OWNER MEMBER COLLABORATOR', github.event.pull_request.author_association)
      )
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode (local) and post review
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENCODE_AUTO_SHARE: "false"
          PROMPT: |
            You are reviewing a GitHub pull request. The PR number is in the PR_NUMBER environment variable.
            You have the `gh` CLI and GITHUB_TOKEN available for gathering context.

            First, gather the PR context:
            - Run `gh pr diff "$PR_NUMBER"` to see the code changes.
            - Run `gh pr view "$PR_NUMBER" --comments` to read the PR description and any existing review comments.
            - Read CODING_STYLES.md and the changed files in the working directory.

            Then review the changes:
            - Check for violations of project's CODING_STYLES.md and code quality issues.
            - Look for potential bugs or vulnerabilities.
            - Focus only on the code changes in this pull request.
            - Explain why something is a problem and what can be done about it.

            Write your final review to a file named `review.md` in the current directory.
            It will be posted to the PR verbatim as a GitHub comment - it IS the deliverable.
            Never end with a description of your process or intentions (e.g. "I was assembling the review") - output the review itself.

            Format the review exactly like this:

            ## PR Review

            <1-3 sentence summary>

            ### Findings (highest priority first)
            1. **[Critical]** `file:line` — <one-sentence headline of what is wrong>
                - **Why it matters:** the consequence in plain terms, stated before the mechanism.
                - **Where:** every relevant `file:line`, listed here and kept out of the prose above.
                - **Fix:** a concrete suggested change.
            2. **[Warning]** `file:line` — <headline> (same four parts)
            3. **[Nit]** `file:line` — <headline> (same four parts)

            ### Previous review issues
            | Status | Issue | Location |
            |--------|-------|----------|
            | ✅ | unclamped limit/k | app.py:110 |
            | ❌ | dashboard stored XSS | dashboard/app.py:42 |

            Rules:
            - Number the findings and order them by priority, most severe first (Critical, then Warning, then Nit).
            - In the "Previous review issues" table, list every issue raised in earlier review comments on this PR (from `gh pr view --comments`): ✅ if you verified it is now fixed in the code, ❌ if it is still present.
            - Verify each previous issue against the current code before marking it; do not trust the table from the previous review.
            - If there was no earlier review on this PR, omit the "Previous review issues" table.
            - If you find no issues, say so in one line instead of the findings list.

            Writing style: write for a busy principal engineer who is not deep in every detail; readable over dense.
            - One idea per finding. Keep sentences short (~20-25 words); never nest run-on clauses or parentheses inside each other.
            - Give every finding these parts, in this order: What (one line), then Why it matters (plain consequence before the mechanism), then Where (`file:line` list), then Fix. Lead with impact, then explain how it happens.
            - Keep `file:line` citations in the "Where" list; use at most one reference inline per sentence so the prose reads clean.
            - Define any domain term on first use ("dedup owner = ..."); prefer active voice and concrete verbs over jargon.
        run: |
          set -euo pipefail
          opencode run "$PROMPT"
          if [ ! -f review.md ]; then
            echo "::error::opencode did not produce review.md"
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --body-file review.md

      - name: Cleanup Comments
        uses: ./.github/actions/cleanup-comments
        with:
          token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          body-pattern: 'All changes compile|All .* suggestion|Changes Summary|PR Review|Bug fixes implemented|## |No action needed'
