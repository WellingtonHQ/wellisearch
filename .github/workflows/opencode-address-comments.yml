name: opencode-address-comments

on:
  # One review submission = one run that handles every /oc comment in it.
  pull_request_review:
    types: [submitted]
  # Standalone inline comments (not part of a review) get their own run.
  # Comments that belong to a review are skipped here and handled by the
  # pull_request_review run above (see the "Determine" step).
  pull_request_review_comment:
    types: [created]
  # Issue-conversation comments. PR conversation comments arrive here too,
  # with a pull_request link on the issue object (see the "Determine" step).
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  address-comments:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Determine whether this event should be acted on
        id: determine
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_ID: ${{ github.event.comment.pull_request_review_id }}
          REVIEW_NUMBER: ${{ github.event.review.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          IS_PR="false"
          PR_NUMBER_OUT=""
          case "$EVENT_NAME" in
            pull_request_review)
              # Act only if at least one inline comment in this review is an /oc command.
              BODIES=$(gh api "repos/$REPO/pulls/$PR_NUMBER/comments?per_page=100" \
                --jq "[.[] | select(.pull_request_review_id == $REVIEW_NUMBER) | select(.body | startswith(\"/oc\") or startswith(\"/opencode\")) | .body] | .[]" \
                2>/dev/null) || BODIES=""
              if [ -z "$BODIES" ]; then
                echo "::notice::No /oc comment found in this review. Exiting."
                exit 0
              fi
              IS_PR="true"
              PR_NUMBER_OUT="$PR_NUMBER"
              ;;
            pull_request_review_comment)
              # Comments that belong to a review are owned by the pull_request_review run.
              if [ -n "$REVIEW_ID" ]; then
                echo "::notice::Comment belongs to review $REVIEW_ID; the review run will handle it. Exiting."
                exit 0
              fi
              case "$COMMENT_BODY" in
                /oc*|/opencode*) : ;;
                *) echo "::notice::Comment does not start with /oc. Exiting."; exit 0 ;;
              esac
              IS_PR="true"
              PR_NUMBER_OUT="$PR_NUMBER"
              ;;
            issue_comment)
              case "$COMMENT_BODY" in
                /oc*|/opencode*) : ;;
                *) echo "::notice::Comment does not start with /oc. Exiting."; exit 0 ;;
              esac
              # PR conversation comments arrive as issue_comment with a
              # pull_request link on the issue; plain issues have none. The
              # event payload has no pull_request object here, so look it up.
              IS_LINK=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER" --jq '.pull_request != null' 2>/dev/null) || IS_LINK="false"
              if [ "$IS_LINK" = "true" ]; then
                IS_PR="true"
                PR_NUMBER_OUT="$ISSUE_NUMBER"
              else
                echo "::notice::Comment is on a plain issue (no associated PR)."
              fi
              ;;
            *)
              echo "::notice::Unhandled event type '$EVENT_NAME'. Exiting."
              exit 0
              ;;
          esac
          {
            echo "is_pr=$IS_PR"
            echo "pr_number=$PR_NUMBER_OUT"
          } >> "$GITHUB_OUTPUT"

      - name: Verify comment author is authorized
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_TYPE: ${{ github.event.comment.user.type }}
          REVIEW_USER: ${{ github.event.review.user.login }}
          REVIEW_TYPE: ${{ github.event.review.user.type }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            COMMENTER="$REVIEW_USER"
            COMMENTER_TYPE="$REVIEW_TYPE"
          else
            COMMENTER="$COMMENT_USER"
            COMMENTER_TYPE="$COMMENT_TYPE"
          fi
          if [ "$COMMENTER_TYPE" = "Bot" ]; then
            echo "::notice::Commenter '$COMMENTER' is a bot account. Exiting."
            exit 0
          fi
          PERM=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq '.permission' 2>/dev/null) || PERM="none"
          echo "Commenter '$COMMENTER' permission: ${PERM}"
          case "$PERM" in
            admin|maintain|write)
              echo "Authorized commenter. Continuing."
              ;;
            *)
              echo "::notice::Commenter '$COMMENTER' is not authorized (permission: ${PERM}; requires write, maintain, or admin). Exiting."
              exit 0
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Check out PR head
        if: steps.determine.outputs.is_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.determine.outputs.pr_number }}
        run: |
          # Review and issue_comment events check out the default branch by
          # default; switch to the PR head so changes land on the PR branch,
          # never the base branch. gh pr checkout is fork-safe.
          gh pr checkout "$PR_NUMBER"

      - name: Create issue branch
        if: steps.determine.outputs.is_pr == 'false'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Plain-issue runs must never push to the default branch. Create a
          # dedicated branch up front so "push to the current branch" in the
          # prompt can only ever land here. The run ID keeps the name unique
          # across successive runs on the same issue.
          SLUG=$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-*//; s/-$//' | cut -c1-40)
          BRANCH="oc/issue-${ISSUE_NUMBER}-${SLUG:-untitled}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write triggering comment(s)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_NUMBER: ${{ github.event.review.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            BODIES_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER/comments?per_page=100" \
              --jq "[.[] | select(.pull_request_review_id == $REVIEW_NUMBER) | select(.body | startswith(\"/oc\") or startswith(\"/opencode\")) | .body]")
            {
              echo "The following review comments must ALL be addressed (each is a separate request):"
              echo ""
              echo "$BODIES_JSON" | jq -r 'to_entries[] | "### Comment \(.key + 1)\n\(.value)\n"'
            } > triggering_comment.txt
          else
            printf '%s' "$COMMENT_BODY" > triggering_comment.txt
          fi

      - name: Run opencode (local) and post reply
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IS_PR: ${{ steps.determine.outputs.is_pr }}
          PR_NUMBER: ${{ steps.determine.outputs.pr_number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OPENCODE_AUTO_SHARE: "false"
        run: |
          set -euo pipefail
          if [ "$IS_PR" = "true" ]; then
            NUM="$PR_NUMBER"
            PROMPT=$(cat <<'EOF'
          You are responding to review comment(s) on a GitHub pull request. The PR number is in the PR_NUMBER environment variable.
          You have the `gh` CLI and GITHUB_TOKEN available.

          Read the triggering comment(s) from the file `triggering_comment.txt` in the current directory.
          If the file contains multiple comments (labeled "### Comment N"), you MUST address EVERY one of them before finishing — do not stop after the first.

          Before pushing any changes, fetch and rebase from origin just before pushing to avoid diverged history conflicts.
          Read each comment and implement the suggestion in the codebase.
          Test and verify changes to make sure they compile and work as expected.
          If you make code changes, commit and push them to the current branch (the PR head branch). Never push to the base branch.
          If a comment is not a suggestion or is a question, write your response or explanation to a file named `reply.md` in the current directory (it will be posted to the PR). Do not make code changes unless told to do so.
          If no changes are currently pending and there is nothing to reply, do not create reply.md.
          EOF
            )
          else
            NUM="$ISSUE_NUMBER"
            PROMPT=$(cat <<'EOF'
          You are responding to a comment on a GitHub issue. The issue number is in the ISSUE_NUMBER environment variable.
          You have the `gh` CLI and GITHUB_TOKEN available.

          Read the triggering comment(s) from the file `triggering_comment.txt` in the current directory.
          If the file contains multiple comments (labeled "### Comment N"), you MUST address EVERY one of them before finishing — do not stop after the first.

          You are already on a dedicated branch for this issue: the workflow created it before you started (named oc/issue-<ISSUE_NUMBER>-...; run `git branch --show-current` to see the exact name).
          Read each comment and implement the suggestion in the codebase, or answer it.
          Test and verify changes to make sure they compile and work as expected.
          If you make code changes, commit and push them to the current branch — it is never the default branch. Include the branch name in your reply.
          If a comment is not a suggestion, write your response or explanation to a file named `reply.md` in the current directory (it will be posted to the issue). Do not make code changes unless told to do so.
          If no changes are currently pending and there is nothing to reply, do not create reply.md.
          EOF
            )
          fi
          opencode run --title "address comments $GITHUB_REPOSITORY #$NUM" "$PROMPT"
          if [ -f reply.md ]; then
            if [ "$IS_PR" = "true" ]; then
              gh pr comment "$PR_NUMBER" --body-file reply.md
            else
              gh issue comment "$ISSUE_NUMBER" --body-file reply.md
            fi
          else
            echo "No reply to post."
          fi

      - name: Cleanup Comments
        uses: ./.github/actions/cleanup-comments
        with:
          token: ${{ github.token }}
          mode: outdated
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number }}
          body-pattern: 'All changes compile|All .* suggestion|Changes Summary|PR Review|Bug fixes implemented|## |No action needed'
