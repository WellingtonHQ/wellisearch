name: build

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install .

      - name: Run unit tests
        run: python tests/test_units.py

      - name: Run dashboard polling tests
        run: node tests/test_dashboard_polling.mjs

      - name: Run browser pool tests
        run: python tests/test_browser_pool.py

      - name: Run resource lifecycle tests
        run: python tests/test_resource_lifecycle.py

      - name: Run crawl memory tests
        run: python tests/test_crawl_memory.py

      - name: Run crawl lane tests
        run: python tests/test_lanes.py

      - name: Run provider adapter tests
        run: python tests/test_providers.py

      - name: Run PR review regression tests
        run: python tests/test_review_regressions.py
