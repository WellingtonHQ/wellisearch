# Ollama serving the 5 benchmark models (CPU host, one model loaded at a time).
#
#   docker compose -f benchmarks/ollama-compose.yml up -d
#   docker compose -f benchmarks/ollama-compose.yml exec ollama ollama pull qwen3:8b
#   docker compose -f benchmarks/ollama-compose.yml exec ollama ollama pull qwen3:4b
#   docker compose -f benchmarks/ollama-compose.yml exec ollama ollama pull gemma3:12b
#   docker compose -f benchmarks/ollama-compose.yml exec ollama ollama pull qwen3:1.7b
#   docker compose -f benchmarks/ollama-compose.yml exec ollama ollama pull qwen3:0.6b
#   docker compose -f benchmarks/ollama-compose.yml exec ollama ollama list
#
# The benchmark talks to http://127.0.0.1:11434/v1 (OpenAI-compatible).
name: llm-cleanup-bench

services:
  ollama:
    image: ollama/ollama:latest
    container_name: bench-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # One slot at a time: the benchmark is sequential, and this avoids Ollama
    # keeping parallel slots (and extra model copies) resident in RAM.
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=10m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  ollama-models:
