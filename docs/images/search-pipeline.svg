<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 830" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="780" height="830" fill="#ffffff"/>

  <!-- start -->
  <rect x="250" y="20" width="280" height="44" rx="22" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="390" y="47" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e1b4b">search_web(query, k, max_crawl, max_age_days?)</text>

  <!-- embed -->
  <rect x="250" y="92" width="280" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="390" y="118" text-anchor="middle" font-size="12" fill="#14532d">embed query → qvec (384-d, fastembed)</text>
  <text x="545" y="106" font-size="10.5" fill="#64748b">embed fails → qvec = NULL</text>
  <text x="545" y="120" font-size="10.5" fill="#64748b">→ FTS + trigram only</text>

  <!-- fn_search_local -->
  <rect x="250" y="164" width="280" height="48" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="390" y="184" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">fn_search_local(query, qvec, k)</text>
  <text x="390" y="201" text-anchor="middle" font-size="11" fill="#475569">hybrid ranking → local rows (see ranking.md)</text>

  <!-- decision: good local? -->
  <polygon points="390,226 530,272 390,318 250,272" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="266" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">good local hit?</text>
  <text x="390" y="283" text-anchor="middle" font-size="10.5" fill="#92400e">score ≥ SEARCH_MIN_SCORE</text>

  <!-- local serve -->
  <rect x="20" y="330" width="280" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="160" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">SERVE LOCAL</text>
  <text x="160" y="370" text-anchor="middle" font-size="11" fill="#15803d">source=local · degraded=false · zero credits</text>
  <text x="160" y="387" text-anchor="middle" font-size="11" fill="#15803d">mark_search_hit → search_hit_count++ per result</text>

  <!-- gateway -->
  <rect x="460" y="330" width="280" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="600" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">GATEWAY (ordered failover)</text>
  <text x="600" y="370" text-anchor="middle" font-size="11" fill="#a16207">tavily → brave</text>
  <text x="600" y="387" text-anchor="middle" font-size="11" fill="#a16207">gates: enabled · configured · quota left</text>

  <!-- decision: served? -->
  <polygon points="600,432 710,470 600,508 490,470" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="600" y="474" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">served?</text>

  <!-- serve gateway -->
  <rect x="460" y="540" width="280" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="562" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">SERVE GATEWAY</text>
  <text x="600" y="580" text-anchor="middle" font-size="11" fill="#15803d">source=&lt;provider&gt; · quota_bump · last_served</text>
  <text x="600" y="597" text-anchor="middle" font-size="11" fill="#15803d">top max_crawl URLs enqueued (background index)</text>

  <!-- exhausted -->
  <rect x="460" y="640" width="280" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="662" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">GATEWAY EXHAUSTED</text>
  <text x="600" y="680" text-anchor="middle" font-size="11" fill="#b91c1c">local rows exist → serve them, degraded=true</text>
  <text x="600" y="697" text-anchor="middle" font-size="11" fill="#b91c1c">no local rows → 502 (source=error)</text>

  <!-- tail -->
  <rect x="250" y="750" width="280" height="52" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="390" y="772" text-anchor="middle" font-size="12" font-weight="600" fill="#1e1b4b">log_search(query, source, results)</text>
  <text x="390" y="790" text-anchor="middle" font-size="11" fill="#4338ca">→ Markdown: Title / URL / Snippet blocks, ---</text>

  <!-- arrows -->
  <line x1="390" y1="64" x2="390" y2="90" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="390" y1="136" x2="390" y2="162" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="390" y1="212" x2="390" y2="224" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <polyline points="250,272 160,272 160,328" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="530,272 600,272 600,328" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="600" y1="340" x2="600" y2="350" stroke="#475569" stroke-width="0" />
  <line x1="600" y1="406" x2="600" y2="430" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <line x1="600" y1="508" x2="600" y2="538" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="490,470 430,470 430,672 458,672" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>

  <polyline points="160,406 160,776 248,776" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polyline points="460,572 390,572 390,748" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <polyline points="460,675 300,675 300,748" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- labels -->
  <text x="186" y="262" font-size="11" font-weight="600" fill="#16a34a">yes</text>
  <text x="536" y="262" font-size="11" font-weight="600" fill="#d97706">no</text>
  <text x="610" y="530" font-size="11" fill="#16a34a">yes</text>
  <text x="436" y="560" font-size="11" fill="#dc2626">all failed</text>
</svg>
