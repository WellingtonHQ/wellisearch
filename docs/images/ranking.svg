<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="500" fill="#ffffff"/>

  <!-- inputs -->
  <rect x="30" y="200" width="160" height="80" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="110" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#1e1b4b">inputs</text>
  <text x="110" y="246" text-anchor="middle" font-size="11" fill="#4338ca">query text</text>
  <text x="110" y="263" text-anchor="middle" font-size="11" fill="#4338ca">qvec (384-d) · k</text>

  <!-- FTS leg -->
  <rect x="260" y="60" width="240" height="96" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="380" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">LEG 1 — Full-text (tsvector)</text>
  <text x="380" y="103" text-anchor="middle" font-size="11" fill="#475569">plainto_tsquery, AND semantics</text>
  <text x="380" y="120" text-anchor="middle" font-size="11" fill="#475569">zero matches → same lexemes OR-ed</text>
  <text x="380" y="137" text-anchor="middle" font-size="11" fill="#475569">ts_rank_cd → top 50 chunks</text>

  <!-- Trigram leg -->
  <rect x="260" y="202" width="240" height="96" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="380" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">LEG 2 — Trigram (pg_trgm)</text>
  <text x="380" y="245" text-anchor="middle" font-size="11" fill="#475569">similarity + word_similarity</text>
  <text x="380" y="262" text-anchor="middle" font-size="11" fill="#475569">chunk text AND page title</text>
  <text x="380" y="279" text-anchor="middle" font-size="11" fill="#475569">score &gt; 0.05 → top 50 chunks</text>

  <!-- Vector leg -->
  <rect x="260" y="344" width="240" height="96" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="380" y="368" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">LEG 3 — Vector (pgvector)</text>
  <text x="380" y="387" text-anchor="middle" font-size="11" fill="#475569">cosine distance vs qvec (HNSW)</text>
  <text x="380" y="404" text-anchor="middle" font-size="11" fill="#475569">top 50 chunks</text>
  <text x="380" y="421" text-anchor="middle" font-size="11" fill="#94a3b8">(skipped when qvec is NULL)</text>

  <!-- RRF -->
  <rect x="570" y="120" width="230" height="130" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="685" y="146" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">RRF fusion (k = 60)</text>
  <text x="685" y="168" text-anchor="middle" font-size="11" fill="#15803d">chunk score = Σ 1/(60 + rank)</text>
  <text x="685" y="185" text-anchor="middle" font-size="11" fill="#15803d">page score = Σ chunk scores</text>
  <text x="685" y="202" text-anchor="middle" font-size="11" fill="#15803d">only top-3 ranks per leg per page</text>
  <text x="685" y="222" text-anchor="middle" font-size="10.5" fill="#64748b">caps long-tail noise; no leg dominates</text>

  <!-- adjustments -->
  <rect x="570" y="290" width="230" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="685" y="314" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">per-page adjustments</text>
  <text x="685" y="336" text-anchor="middle" font-size="11" fill="#15803d">+ 0.005·ln(1+fetch_count)</text>
  <text x="685" y="353" text-anchor="middle" font-size="10.5" fill="#64748b">additive prominence prior</text>
  <text x="685" y="373" text-anchor="middle" font-size="11" fill="#15803d">× exp(−age_days / 14)</text>
  <text x="685" y="390" text-anchor="middle" font-size="10.5" fill="#64748b">14-day freshness half-life-ish decay</text>

  <!-- output -->
  <rect x="850" y="200" width="105" height="120" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="902" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#1e1b4b">top-k</text>
  <text x="902" y="243" text-anchor="middle" font-size="10" fill="#4338ca">url · title</text>
  <text x="902" y="258" text-anchor="middle" font-size="10" fill="#4338ca">snippet (≤400 ch)</text>
  <text x="902" y="273" text-anchor="middle" font-size="10" fill="#4338ca">score</text>
  <text x="902" y="288" text-anchor="middle" font-size="10" fill="#4338ca">last_crawled</text>
  <text x="902" y="303" text-anchor="middle" font-size="10" fill="#4338ca">fetch_count</text>

  <!-- threshold note -->
  <rect x="570" y="430" width="230" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-dasharray="5 3"/>
  <text x="685" y="452" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">app layer (search_web.py)</text>
  <text x="685" y="470" text-anchor="middle" font-size="11" fill="#a16207">score ≥ SEARCH_MIN_SCORE (0.12) → serve local, else gateway</text>

  <!-- arrows -->
  <line x1="190" y1="226" x2="258" y2="118" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="190" y1="240" x2="258" y2="250" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="190" y1="254" x2="258" y2="392" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="500" y1="108" x2="568" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="250" x2="568" y2="185" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="392" x2="568" y2="228" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="685" y1="250" x2="685" y2="288" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="800" y1="345" x2="848" y2="280" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="902" y1="320" x2="902" y2="400" stroke="#94a3b8" stroke-width="0"/>
  <line x1="790" y1="458" x2="848" y2="330" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
</svg>
