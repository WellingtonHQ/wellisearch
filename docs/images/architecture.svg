<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>

  <!-- LLM client -->
  <rect x="330" y="24" width="300" height="64" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="480" y="49" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">LLM client</text>
  <text x="480" y="68" text-anchor="middle" font-size="12" fill="#4338ca">OWUI / opencode — MCP (Streamable HTTP) + REST (API key)</text>

  <!-- wellisearch container -->
  <rect x="230" y="140" width="500" height="240" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">wellisearch — 1 Docker container (FastAPI + uvicorn, 1 process)</text>

  <rect x="250" y="184" width="230" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="365" y="207" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">REST API  /api/*</text>
  <text x="365" y="224" text-anchor="middle" font-size="11" fill="#475569">search · fetch · seed · pages · logs</text>

  <rect x="495" y="184" width="215" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="602" y="207" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">MCP server  /mcp/http</text>
  <text x="602" y="224" text-anchor="middle" font-size="11" fill="#475569">exactly 6 tools, same pipeline</text>

  <rect x="250" y="252" width="230" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="365" y="275" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Background worker</text>
  <text x="365" y="292" text-anchor="middle" font-size="11" fill="#475569">asyncio task: drain queue + watchlist</text>

  <rect x="495" y="252" width="215" height="56" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="602" y="275" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Static dashboard  /</text>
  <text x="602" y="292" text-anchor="middle" font-size="11" fill="#475569">vanilla JS, no build step</text>

  <rect x="250" y="320" width="460" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="480" y="346" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">core: search_web pipeline · provider gateway · chunker · fastembed · Postgres (psycopg)</text>

  <!-- Postgres -->
  <rect x="790" y="140" width="150" height="240" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="865" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">shared Postgres 18</text>
  <text x="865" y="182" text-anchor="middle" font-size="11" fill="#6d28d9">pgvector · pg_trgm</text>
  <text x="805" y="210" font-size="11.5" fill="#4c1d95">pages</text>
  <text x="805" y="230" font-size="11.5" fill="#4c1d95">chunks (tsv + vector)</text>
  <text x="805" y="250" font-size="11.5" fill="#4c1d95">crawl_queue</text>
  <text x="805" y="270" font-size="11.5" fill="#4c1d95">search_log</text>
  <text x="805" y="290" font-size="11.5" fill="#4c1d95">crawl_log</text>
  <text x="805" y="310" font-size="11.5" fill="#4c1d95">provider_quota</text>
  <text x="805" y="330" font-size="11.5" fill="#4c1d95">provider_state</text>
  <text x="805" y="360" font-size="10.5" fill="#6d28d9">fn_search_local()</text>

  <!-- Crawl4AI -->
  <rect x="60" y="480" width="200" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="160" y="507" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Crawl4AI server</text>
  <text x="160" y="526" text-anchor="middle" font-size="11" fill="#15803d">POST /md — single crawling path</text>

  <!-- Gateway -->
  <rect x="295" y="460" width="370" height="110" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="480" y="484" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">provider gateway (ordered failover)</text>
  <rect x="305" y="498" width="80" height="34" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="345" y="520" text-anchor="middle" font-size="11.5" fill="#92400e">tavily</text>
  <rect x="395" y="498" width="80" height="34" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="435" y="520" text-anchor="middle" font-size="11.5" fill="#92400e">brave</text>
  <rect x="485" y="498" width="80" height="34" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="525" y="520" text-anchor="middle" font-size="11.5" fill="#92400e">exa</text>
  <rect x="575" y="498" width="80" height="34" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="615" y="520" text-anchor="middle" font-size="11.5" fill="#92400e">youcom</text>
  <text x="480" y="556" text-anchor="middle" font-size="10.5" fill="#a16207">monthly quota ledger · runtime toggles (provider_state)</text>

  <!-- arrows -->
  <line x1="480" y1="88" x2="480" y2="138" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="730" y1="260" x2="788" y2="260" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="350" y1="380" x2="180" y2="478" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="560" y1="380" x2="490" y2="458" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- arrow labels -->
  <text x="492" y="120" font-size="11" fill="#475569">MCP / REST + API key</text>
  <text x="742" y="252" font-size="11" fill="#475569">SQL · vectors</text>
  <text x="196" y="446" font-size="11" fill="#475569">crawl: POST /md (45 s timeout)</text>
  <text x="568" y="432" font-size="11" fill="#475569">only on local miss</text>
</svg>
