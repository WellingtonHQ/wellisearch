<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="580" fill="#ffffff"/>

  <text x="40" y="28" font-size="14" font-weight="700" fill="#0f172a">indexing pipeline — every crawl flows through one store_page()</text>

  <!-- triggers -->
  <rect x="40" y="50" width="240" height="200" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="160" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">triggers</text>
  <text x="54" y="98" font-size="11" fill="#991b1b">• search miss → top max_crawl URLs</text>
  <text x="54" y="115" font-size="10.5" fill="#991b1b">  (speculative, source=search)</text>
  <text x="54" y="138" font-size="11" fill="#991b1b">• seed_url / POST /api/seed</text>
  <text x="54" y="155" font-size="10.5" fill="#991b1b">  (manual, source=seed)</text>
  <text x="54" y="178" font-size="11" fill="#991b1b">• worker watchlist tick</text>
  <text x="54" y="195" font-size="10.5" fill="#991b1b">  (top fetch_count, oldest crawl)</text>
  <text x="54" y="218" font-size="11" fill="#991b1b">• fetch_page / fetch_pages</text>
  <text x="54" y="235" font-size="10.5" fill="#991b1b">  (immediate, trigger=fetch)</text>

  <!-- queue -->
  <rect x="350" y="60" width="230" height="100" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="465" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">crawl_queue</text>
  <text x="465" y="104" text-anchor="middle" font-size="11" fill="#15803d">dedupe: partial UQ (pending/in_flight)</text>
  <text x="465" y="121" text-anchor="middle" font-size="11" fill="#15803d">pending → in_flight → done/failed</text>
  <text x="465" y="138" text-anchor="middle" font-size="11" fill="#15803d">≤3 attempts; transient → re-enqueue</text>
  <text x="465" y="155" text-anchor="middle" font-size="10.5" fill="#64748b">503/504/timeout = transient</text>

  <!-- worker -->
  <rect x="350" y="210" width="230" height="100" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="465" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">worker tick</text>
  <text x="465" y="254" text-anchor="middle" font-size="11" fill="#1d4ed8">every 30 min or debounced kick (5 s)</text>
  <text x="465" y="271" text-anchor="middle" font-size="11" fill="#1d4ed8">drain budget 25 · parallelism 3</text>
  <text x="465" y="288" text-anchor="middle" font-size="11" fill="#1d4ed8">then watchlist refresh pass</text>
  <text x="465" y="305" text-anchor="middle" font-size="10.5" fill="#64748b">single asyncio task, one app process</text>

  <!-- crawl4ai -->
  <rect x="650" y="60" width="230" height="100" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="765" y="84" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Crawl4AI — POST /md</text>
  <text x="765" y="104" text-anchor="middle" font-size="11" fill="#15803d">single crawling path for the whole app</text>
  <text x="765" y="121" text-anchor="middle" font-size="11" fill="#15803d">45 s timeout · Bearer API key</text>
  <text x="765" y="138" text-anchor="middle" font-size="11" fill="#15803d">fit markdown out</text>
  <text x="765" y="155" text-anchor="middle" font-size="10.5" fill="#64748b">no raw-html scraping anywhere</text>

  <!-- store -->
  <rect x="650" y="210" width="230" height="170" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="765" y="234" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">store_page (1 transaction)</text>
  <text x="765" y="256" text-anchor="middle" font-size="11" fill="#1d4ed8">sha256(markdown) unchanged</text>
  <text x="765" y="272" text-anchor="middle" font-size="10.5" fill="#64748b">+ same model → skip re-embed, bump crawl_count</text>
  <text x="765" y="294" text-anchor="middle" font-size="11" fill="#1d4ed8">chunk_markdown ≤800 tokens</text>
  <text x="765" y="310" text-anchor="middle" font-size="10.5" fill="#64748b">fence/heading-safe boundaries</text>
  <text x="765" y="330" text-anchor="middle" font-size="11" fill="#1d4ed8">fastembed → 384-d vectors</text>
  <text x="765" y="350" text-anchor="middle" font-size="11" fill="#1d4ed8">upsert pages · replace chunks</text>

  <!-- on-demand -->
  <rect x="350" y="360" width="230" height="80" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="465" y="384" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">on-demand read path</text>
  <text x="465" y="404" text-anchor="middle" font-size="11" fill="#a16207">fetch_page / refresh_page</text>
  <text x="465" y="421" text-anchor="middle" font-size="11" fill="#a16207">not in index → crawl now → store_page</text>

  <!-- log -->
  <rect x="650" y="430" width="230" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="765" y="454" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">crawl_log</text>
  <text x="765" y="472" text-anchor="middle" font-size="11" fill="#64748b">status · ms · chunks_written · detail</text>

  <!-- note -->
  <rect x="40" y="500" width="840" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 3"/>
  <text x="460" y="519" text-anchor="middle" font-size="11.5" fill="#475569">in-flight dedupe: worker, fetch_page, refresh_page and seed all funnel through the same crawl_url guard —</text>
  <text x="460" y="536" text-anchor="middle" font-size="11.5" fill="#475569">the same URL is never crawled twice concurrently</text>

  <!-- arrows -->
  <line x1="280" y1="110" x2="348" y2="110" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="465" y1="160" x2="465" y2="208" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polyline points="580,240 615,240 615,110 648,110" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="622" y="180" font-size="10.5" fill="#475569">drain items</text>

  <line x1="765" y1="160" x2="765" y2="208" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="775" y="188" font-size="10.5" fill="#475569">fit markdown</text>

  <polyline points="580,390 615,390 615,140 648,140" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="622" y="197" font-size="10.5" fill="#b45309">crawl_url</text>

  <line x1="765" y1="380" x2="765" y2="428" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
