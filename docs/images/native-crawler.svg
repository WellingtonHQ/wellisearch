<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="1140" height="540" fill="#ffffff"/>

  <text x="40" y="28" font-size="14" font-weight="700" fill="#0f172a">native crawl engine — general flow + per-site extractors (yt-dlp style)</text>
  <text x="40" y="46" font-size="10.5" fill="#64748b">Crawl4AI replacement · policy-driven tier ladder (HTTP → Browser → Stealth) → site or generic fit-markdown extractor → quality gate · all deps permissive (no AGPL)</text>

  <!-- 1 · request -->
  <rect x="40" y="70" width="160" height="190" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="54" y="94" font-size="12.5" font-weight="700" fill="#334155">1 · request</text>
  <text x="54" y="118" font-size="10.5" fill="#475569">worker.py — queue + watchlist</text>
  <text x="54" y="134" font-size="10.5" fill="#475569">fetch.py — on demand</text>
  <text x="54" y="158" font-size="10.5" fill="#475569">→ fit_markdown(url)</text>
  <text x="54" y="174" font-size="10.5" fill="#475569">crawler.py facade</text>
  <text x="54" y="190" font-size="10.5" fill="#475569">(contract unchanged)</text>
  <text x="54" y="214" font-size="10.5" fill="#475569">CRAWL_ENGINE dispatch:</text>
  <text x="54" y="230" font-size="10.5" fill="#475569">native | crawl4ai</text>

  <!-- 2 · policy -->
  <rect x="240" y="70" width="180" height="190" rx="10" fill="#fffbeb" stroke="#d97706"/>
  <text x="254" y="94" font-size="12.5" font-weight="700" fill="#92400e">2 · policy match</text>
  <text x="254" y="118" font-size="10.5" fill="#92400e">per-domain table (policy.py):</text>
  <text x="254" y="134" font-size="10.5" fill="#92400e">tiers · profile · waits</text>
  <text x="254" y="150" font-size="10.5" fill="#92400e">extractor · paywall_ok</text>
  <text x="254" y="166" font-size="10.5" fill="#92400e">escalate budget</text>
  <text x="254" y="190" font-size="10.5" fill="#92400e">default: [http, browser]</text>
  <text x="254" y="206" font-size="10.5" fill="#92400e">shared profile · generic</text>
  <text x="254" y="230" font-size="10.5" fill="#92400e">retail: [browser] · dedicated</text>
  <text x="254" y="246" font-size="10.5" fill="#92400e">nytimes: [browser, stealth]</text>

  <!-- 3 · tier ladder -->
  <rect x="460" y="70" width="260" height="190" rx="10" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="590" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">3 · tier ladder — escalate on bot-wall</text>

  <rect x="475" y="100" width="200" height="42" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="575" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">T0 · HTTP — curl_cffi</text>
  <text x="575" y="132" text-anchor="middle" font-size="9.5" fill="#475569">static pages · no JS · ~0.5 s</text>

  <rect x="475" y="148" width="200" height="42" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="575" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">T1 · BROWSER — patchright</text>
  <text x="575" y="180" text-anchor="middle" font-size="9.5" fill="#475569">Xvfb · warm profile · challenge loop · network-idle</text>

  <rect x="475" y="196" width="200" height="42" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="575" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">T2 · STEALTH — Scrapling</text>
  <text x="575" y="228" text-anchor="middle" font-size="9.5" fill="#475569">CF auto-solve · metered paywall · slowest</text>

  <path d="M 675 121 H 698 V 217 H 681" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>
  <text transform="rotate(90 712 170)" x="712" y="170" text-anchor="middle" font-size="9" fill="#b91c1c">bot-wall / thin → escalate</text>

  <!-- 4 · extractor -->
  <rect x="760" y="70" width="180" height="190" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="774" y="94" font-size="12.5" font-weight="700" fill="#14532d">4 · extractor (registry)</text>
  <text x="774" y="118" font-size="10.5" fill="#166534">by domain (yt-dlp style):</text>
  <text x="774" y="134" font-size="10.5" fill="#166534">amazon · walmart · target</text>
  <text x="774" y="150" font-size="10.5" fill="#166534">bestbuy · nytimes · wsj</text>
  <text x="774" y="166" font-size="10.5" fill="#166534">reuters · guardian · ap</text>
  <text x="774" y="190" font-size="10.5" fill="#166534">fallback: GenericExtractor</text>
  <text x="774" y="206" font-size="10.5" fill="#166534">trafilatura ⊕ readability</text>
  <text x="774" y="222" font-size="10.5" fill="#166534">→ trim · normalize · cap</text>
  <text x="774" y="246" font-size="10.5" fill="#166534">site gate: price? body? paywall?</text>

  <!-- 5 · gate + result -->
  <rect x="980" y="70" width="120" height="190" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="994" y="94" font-size="12.5" font-weight="700" fill="#4c1d95">5 · gate + result</text>
  <text x="994" y="118" font-size="10.5" fill="#5b21b6">accept(fitted)?</text>
  <text x="994" y="142" font-size="10.5" fill="#5b21b6">ok → CrawlResult</text>
  <text x="994" y="158" font-size="10.5" fill="#5b21b6">(title, markdown,</text>
  <text x="994" y="174" font-size="10.5" fill="#5b21b6">engine, extractor)</text>
  <text x="994" y="198" font-size="10.5" fill="#5b21b6">no → next tier</text>
  <text x="994" y="222" font-size="10.5" fill="#5b21b6">all failed →</text>
  <text x="994" y="238" font-size="10.5" fill="#5b21b6">best partial | CrawlError</text>

  <!-- main flow arrows -->
  <line x1="200" y1="165" x2="238" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="165" x2="458" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="165" x2="758" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="940" y1="165" x2="978" y2="165" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- pool + profiles -->
  <rect x="460" y="300" width="260" height="150" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="474" y="324" font-size="12.5" font-weight="700" fill="#334155">pool + profiles (browser tier)</text>
  <text x="474" y="348" font-size="10.5" fill="#475569">spawn / poll / reap · semaphore</text>
  <text x="474" y="364" font-size="10.5" fill="#475569">per-domain warm profiles:</text>
  <text x="474" y="380" font-size="10.5" fill="#475569">dedicated retail · shared long-tail</text>
  <text x="474" y="396" font-size="10.5" fill="#475569">LRU GC · volume-backed</text>
  <text x="474" y="420" font-size="10.5" fill="#475569">ported from the proven fork worker</text>

  <line x1="590" y1="300" x2="590" y2="262" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- existing pipeline (unchanged) -->
  <rect x="40" y="300" width="340" height="150" rx="10" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="54" y="324" font-size="12.5" font-weight="700" fill="#0f766e">→ existing pipeline (unchanged)</text>
  <text x="54" y="348" font-size="10.5" fill="#115e59">store_page(): hash → chunk → embed → upsert</text>
  <text x="54" y="364" font-size="10.5" fill="#115e59">crawl_log: tier + extractor + escalation</text>
  <text x="54" y="380" font-size="10.5" fill="#115e59">fetch_page / fetch_pages serve stored fit-markdown</text>
  <text x="54" y="396" font-size="10.5" fill="#115e59">search_web local-first — no change</text>

  <!-- config -->
  <rect x="760" y="300" width="180" height="150" rx="10" fill="#eef2ff" stroke="#4338ca"/>
  <text x="774" y="324" font-size="12.5" font-weight="700" fill="#3730a3">config knobs (config.py)</text>
  <text x="774" y="348" font-size="10.5" fill="#4338ca">CRAWL_ENGINE=native|crawl4ai</text>
  <text x="774" y="364" font-size="10.5" fill="#4338ca">CRAWL_POOL_SIZE</text>
  <text x="774" y="380" font-size="10.5" fill="#4338ca">CRAWL_CHALLENGE_BUDGET_S</text>
  <text x="774" y="396" font-size="10.5" fill="#4338ca">CRAWL_MD_MAX_CHARS</text>
  <text x="774" y="412" font-size="10.5" fill="#4338ca">CRAWL_PROFILE_DIR</text>
  <text x="774" y="428" font-size="10.5" fill="#4338ca">CRAWL_TIMEOUT_S (existing)</text>

  <!-- licenses -->
  <rect x="980" y="300" width="120" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="994" y="324" font-size="12.5" font-weight="700" fill="#14532d">licenses</text>
  <text x="994" y="348" font-size="10.5" fill="#166534">patchright</text>
  <text x="994" y="362" font-size="10" fill="#16a34a">Apache-2.0</text>
  <text x="994" y="380" font-size="10.5" fill="#166534">scrapling BSD-3</text>
  <text x="994" y="396" font-size="10.5" fill="#166534">curl_cffi MIT</text>
  <text x="994" y="412" font-size="10.5" fill="#166534">trafilatura Apache-2.0</text>
  <text x="994" y="428" font-size="10.5" fill="#166534">readability BSD</text>
  <text x="994" y="444" font-size="10.5" font-weight="700" fill="#15803d">→ no AGPL</text>

  <!-- result → pipeline -->
  <path d="M 1040 260 V 480 H 210 V 452" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="474" text-anchor="middle" font-size="9.5" fill="#475569">CrawlResult (title, markdown, engine, extractor) → worker / fetch</text>
</svg>
