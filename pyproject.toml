[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wellisearch"
dynamic = ["version"]
description = "Self-hosted search gateway + web-index service for the OWUI agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=2.1",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "fastembed>=0.4",
  "httpx>=0.27",
  "pydantic-settings>=2.3",
  # native crawl engine (design §4 dependency delta; all permissive)
  "patchright>=1.50",
  "scrapling[fetchers]>=0.4",
  "curl_cffi>=0.7",
  "trafilatura>=2.0",
  "readability-lxml>=0.8",
  "markdownify>=1.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.scripts]
wellisearch = "wellisearch.app:main"

[tool.hatch.version]
path = "src/wellisearch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wellisearch"]
