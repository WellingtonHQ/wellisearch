[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wellisearch"
version = "1.2.0"
description = "Self-hosted search gateway + web-index service for the OWUI agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=2.1",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "fastembed>=0.4",
  "httpx>=0.27",
  "pydantic-settings>=2.3",
]

[project.scripts]
wellisearch = "wellisearch.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wellisearch"]
