# wellisearch — app container (one project, one network).
#
# Networks:
#   - wellisearch_default : managed by THIS project — `docker compose up -d`
#                          creates it (project name "wellisearch" + _default).
#                          OpenWebUI (if present) joins it by name so it keeps
#                          reaching `wellisearch:8780` for its external web
#                          loader.
#
# Postgres: reached over the network via POSTGRES_HOST (Tailscale hostname),
# not a shared docker network. This lets a second wellisearch instance on
# another machine join the same queue — both connect to the same Postgres.
# No depends_on on postgres: ordering is handled by the app's startup DB
# retry (~10 x 3 s) + self-creating the `wellisearch` DB.
name: wellisearch

services:
  wellisearch:
    build: .
    container_name: wellisearch
    restart: unless-stopped
    mem_limit: 16G
    env_file: .env
    ports:
      - "8780:8780"
    volumes:
      - profiles:/profiles   # warm browser profiles (CRAWL_PROFILE_DIR=/profiles)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8780/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - wellisearch_default

volumes:
  profiles:   # warm browser profiles (CRAWL_PROFILE_DIR=/profiles)

networks:
  wellisearch_default:   # managed: created/removed by this project
    name: wellisearch_default  # pin the real name (OWUI stack joins by name)
